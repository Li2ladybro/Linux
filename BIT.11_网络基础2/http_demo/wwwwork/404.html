<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — 页面走丢了</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #080a10;
      --text: #e9eef8;
      --muted: #8b95a9;
      --primary: #6366f1;
      --accent: #22d3ee;
      --danger: #f43f5e;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 背景光斑 */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: .45;
      pointer-events: none;
      z-index: 0;
    }

    .glow-1 {
      width: 500px;
      height: 500px;
      background: #4f46e5;
      top: -150px;
      left: -100px;
      animation: float 12s ease-in-out infinite;
    }

    .glow-2 {
      width: 450px;
      height: 450px;
      background: #0e7490;
      bottom: -150px;
      right: -100px;
      animation: float 15s ease-in-out infinite reverse;
    }

    .glow-3 {
      width: 300px;
      height: 300px;
      background: #f43f5e;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: .15;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0) scale(1)
      }

      50% {
        transform: translate(30px, 40px) scale(1.08)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .1;
        transform: translate(-50%, -50%) scale(1)
      }

      50% {
        opacity: .25;
        transform: translate(-50%, -50%) scale(1.3)
      }
    }

    /* 容器 */
    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    /* 404 数字 */
    .code-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .code {
      font-size: clamp(120px, 22vw, 240px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.05em;
      background: linear-gradient(135deg, #a5b4fc 0%, #22d3ee 50%, #f43f5e 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      position: relative;
      user-select: none;
      animation: codeFloat 4s ease-in-out infinite;
    }

    @keyframes codeFloat {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-10px)
      }
    }

    /* 故障风格重影（可选，这里用伪元素做轻微重影） */
    .code::before,
    .code::after {
      content: "404";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: inherit;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      z-index: -1;
    }

    .code::before {
      transform: translate(-4px, -2px);
      background: linear-gradient(135deg, #f43f5e, #22d3ee);
      animation: glitch1 3s infinite linear alternate-reverse;
    }

    .code::after {
      transform: translate(4px, 2px);
      background: linear-gradient(135deg, #6366f1, #f43f5e);
      animation: glitch2 2.5s infinite linear alternate-reverse;
    }

    @keyframes glitch1 {

      0%,
      90%,
      100% {
        opacity: 0
      }

      92%,
      96% {
        opacity: .5;
        transform: translate(-6px, -3px)
      }
    }

    @keyframes glitch2 {

      0%,
      85%,
      100% {
        opacity: 0
      }

      88%,
      94% {
        opacity: .4;
        transform: translate(6px, 3px)
      }
    }

    h1 {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 16px;
    }

    h1 span {
      background: linear-gradient(120deg, #a5b4fc, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      color: var(--muted);
      font-size: clamp(14px, 1.8vw, 16px);
      max-width: 480px;
      margin-bottom: 40px;
      line-height: 1.7;
    }

    /* 按钮组 */
    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: .25s;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #08111a;
      box-shadow: 0 10px 26px -10px rgba(99, 102, 241, .8);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 34px -10px rgba(99, 102, 241, 1);
    }

    .btn-ghost {
      color: var(--text);
      border-color: rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .03);
      backdrop-filter: blur(10px);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, .08);
      transform: translateY(-3px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    /* 底部提示 */
    .footer-text {
      position: absolute;
      bottom: 24px;
      font-size: 13px;
      color: rgba(139, 149, 169, .5);
    }

    /* 响应式 */
    @media (max-width:600px) {
      .actions {
        flex-direction: column;
        width: 100%;
        max-width: 260px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- 背景光斑 -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <!-- 内容 -->
  <div class="container">
    <div class="code-wrap">
      <div class="code" id="glitchCode">404</div>
    </div>

    <h1>页面<span>走丢了</span></h1>
    <p>你访问的资源不存在，可能已被移除、重命名，或者你输入了一个错误的链接。不要担心，让我们带你回到安全的地方。</p>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        返回首页
      </a>
      <button onclick="history.back()" class="btn btn-ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        回到上一页
      </button>
    </div>

    <div class="footer-text">Error Code: HTTP 404 Not Found</div>
  </div>

  <script>
    // 简单的鼠标视差交互
    const code = document.getElementById('glitchCode');
    const glow1 = document.querySelector('.glow-1');
    const glow2 = document.querySelector('.glow-2');

    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;

      // 数字反向微动
      code.style.transform = `translate(${x * -12}px, ${y * -12}px)`;

      // 背景光斑正向微动
      glow1.style.transform = `translate(${x * 20}px, ${y * 20}px) scale(1.05)`;
      glow2.style.transform = `translate(${x * -25}px, ${y * -25}px) scale(1.05)`;
    });
  </script>

</body>

</html>
